
name: Build and deploy Node.js app to Azure Web App - rgbhai-backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install backend dependencies
        working-directory: NEW FOLDER/backend
        run: npm install

      - name: Create deployment package
        run: |
          cd "NEW FOLDER/backend"
          zip -r "$GITHUB_WORKSPACE/backend.zip" . \
            -x "node_modules/*" \
               ".env" \
               ".git/*"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: backend.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Deploy to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: rgbhai-backend
          package: backend.zip
